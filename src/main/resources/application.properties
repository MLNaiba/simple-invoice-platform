spring.application.name=SimpleInvoicePlatform

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=invoice-platform

spring.data.mongodb.auto-index-creation=true

security.admin.username=${INVOICE_ADMIN_USERNAME:}
security.admin.password=${INVOICE_ADMIN_PASSWORD:}

security.jwt.secret=${INVOICE_JWT_SECRET}
security.jwt.expiration=1h